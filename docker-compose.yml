services:

  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - airflow_postgres:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U airflow -d airflow"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    volumes:
      - minio_data:/data

    ports:
      - "9000:9000"
      - "9001:9001"

    restart: unless-stopped


  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_started

    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        sleep 1;
      done;
      mc mb --ignore-existing local/geocoding;
      exit 0;
      "

  airflow:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      airflow-init:
        condition: service_completed_successfully

    env_file:
      - .env
      - ${ENV_PATH:-.env}

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg://airflow:airflow@postgres:5432/airflow

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__API__BASE_URL: http://localhost:8080

      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}

      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"

      PYTHONPATH: /opt/airflow

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./backend:/opt/airflow/backend
      - ./sql:/opt/airflow/sql
      - ./logs:/opt/airflow/logs
      - ./data:/opt/airflow/data

    ports:
      - "8080:8080"

    command:
      - bash
      - -c
      - |
        airflow api-server &

        airflow scheduler &
        airflow dag-processor &

        wait

    restart: unless-stopped


  airflow-tests:
    profiles:
      - tests

    build:
      context: .
      dockerfile: docker/airflow/Dockerfile

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

    env_file:
      - .env.example

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg://airflow:airflow@postgres:5432/airflow

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__API__BASE_URL: http://localhost:8080

      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}

      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"

      PYTHONPATH: /opt/airflow/project:/opt/airflow/project/airflow

    volumes:
      - .:/opt/airflow/project

    working_dir: /opt/airflow/project

    entrypoint: ["pytest"]

    command:
      - airflow/tests/
      - -v

  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - .env
      - ${ENV_PATH:-.env}

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg://airflow:airflow@postgres:5432/airflow

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}

      PYTHONPATH: /opt/airflow

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./backend:/opt/airflow/backend

    command:
    - bash
    - -c
    - |
      set -e

      airflow db migrate

      airflow pools get yandex_geocoder >/dev/null 2>&1 || \
        airflow pools set yandex_geocoder 5 "Yandex Geocoder API"

volumes:
  airflow_postgres:
  minio_data: